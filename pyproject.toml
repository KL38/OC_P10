[project]
name = "oc-p10"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "easyocr>=1.7.2",
    "faiss-cpu>=1.14.2",
    "langchain>=0.3.0,<0.4",
    "langchain-community>=0.3.0,<0.4",
    "langchain-core>=0.3.0,<0.4",
    "langchain-mistralai>=0.2.0,<0.3",
    "langchain-text-splitters>=0.3.0,<0.4",
    "litellm>=1.88.1",
    "logfire>=4.35.0",
    "mistralai>=1.5.1,<2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic-ai-slim>=1.106.0",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.13.1",
    "python-docx>=1.2.0",
    "ragas>=0.4.3",
    "streamlit>=1.58.0",
    "torch>=2.11.0",
    "torchvision>=0.20.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sportsee_rag"]
