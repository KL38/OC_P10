[project]
name = "oc-p10"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "easyocr>=1.7.2",
    "faiss-cpu>=1.14.2",
    "langchain-core>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "logfire>=4.35.0",
    "mistralai>=2.4.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic-ai>=1.106.0",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.13.1",
    "python-docx>=1.2.0",
    "torch>=2.11.0",
    "torchvision>=0.20.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportsee_rag"]
